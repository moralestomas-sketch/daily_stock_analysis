name: 定时兜底触发

# 背景：GitHub 的 schedule 在每小时整点最拥堵，scheduled run 可能被延迟很久甚至直接丢弃。
# 2026-11-10 实测：主流程 00:00 UTC 的定时未触发，超过 75 分钟仍无运行记录。
# 本工作流在 UTC 00:07（北京时间 08:07）做一次检查：若过去 24 小时没有成功或进行中的主流程运行，
# 就主动 dispatch 主流程，保证当天报告仍能产出。

on:
  schedule:
    - cron: '7 0 * * 2-6'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: schedule-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查是否需要兜底触发主流程
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_WF: 00-daily-analysis.yml
        run: |
          set -euo pipefail
          count=$(gh run list -R "$REPO" --workflow "$TARGET_WF" --limit 20 \
            --json createdAt,status,conclusion \
            --jq '[.[] | select(((now - (.createdAt | fromdateiso8601)) < 86400) and (.status != "completed" or .conclusion == "success"))] | length')
          echo "过去 24 小时内成功或进行中的主流程运行数: $count"
          if [ "$count" -ge 1 ]; then
            echo "主流程已有运行，兜底不触发"
            exit 0
          fi
          echo "未发现运行记录，触发主流程"
          gh workflow run "$TARGET_WF" -R "$REPO" -f mode=full
          echo "已提交触发请求"
