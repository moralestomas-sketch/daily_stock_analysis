name: tmp-cron-patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cron-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: patch cron line
        run: python3 scripts/tmp_patch.py
      - name: commit and cleanup
        run: |
          git config user.name "cron-patch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/workflows/00-daily-analysis.yml
          git rm -f .github/workflows/tmp-cron-patch.yml scripts/tmp_patch.py
          git commit -m "定时改为美股收盘后30分钟（UTC 21:30 = 北京时间次日 05:30）"
          git push origin HEAD:main
